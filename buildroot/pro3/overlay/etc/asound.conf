pcm.!default {
	type asym
	playback.pcm "PlaybackSPK"
	capture.pcm "CaptureMIC"
}

pcm.PlaybackSPK {
	type hooks
	slave.pcm "hw:sndi2s0"
	hooks.0 {
	type ctl_elems
	hook_args [
		{
			name "OutputL Mixer DACL Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "OutputR Mixer DACR Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "LINEOUTL Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "LINEOUTR Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "SPK Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "SPK Volume"
			preserve true
			lock true
			value 16
		}
	]
	}
}

pcm.PlaybackHP {
	type hooks
	slave.pcm "hw:sndi2s0"
	hooks.0 {
	type ctl_elems
	hook_args [
		{
			name "HPOUT Switch"
			preserve true
			lock true
			value 1
		}
	]
	}
}

pcm.PlaybackSPDIF {
	type hw
	card "sndspdif"
}

pcm.PlaybackHDMI {
	type hw
	card "sndhdmi"
}

pcm.CaptureMIC {
	type hooks
	slave.pcm "hw:sndi2s0"
	hooks.0 {
	type ctl_elems
	hook_args [
		{
			name "MIC1 Switch"
			preserve true
			lock true
			value 1
		}
		{
			name "MIC2 Switch"
			preserve true
			lock true
			value 1
		}
	]
	}
}
